
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: uv sync --locked
    - name: Docs
      run: |
        uv run sphinx-build -W --keep-going -b html docs gh-pages
    - name: Install Chrome for image export
      run: uv run plotly_get_chrome -y
    - name: Coverage
      run: |
        uv run coverage run -m pytest
        echo "COVERAGE=$(uv run coverage report --precision 2 | grep TOTAL | tr -s ' ' | cut -f 4 -d " ")" >> $GITHUB_ENV
        uv run coverage html --directory gh-pages/coverage
    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: gh-pages # The folder the action should deploy.
    
    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: f84ac74436887cd42d77fbe2246d1f57
        filename: coverage-badge.json
        label: coverage
        message: ${{ env.COVERAGE }}
        color: green
