stages:
  - build
  - deploy

docs:
  stage: build
  image: python:3.8-slim-buster
  before_script:
    - apt-get update && apt-get install -y build-essential git pandoc
    - pip install uv
    - uv sync --locked
  script:
    - uv run coverage run -m pytest
    - uv run coverage html
    - uv run sphinx-build -b html docs docshtml
    - uv run coverage report    
  artifacts:
    paths:
      - docshtml/
      - htmlcov/

pages:
  stage: deploy
  image: alpine
  dependencies:
    - docs
  script:
    - mv docshtml/ public/
    - mv htmlcov/ public/coverage/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - master
      