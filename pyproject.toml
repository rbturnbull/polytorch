[project]
name = "PolyTorch"
version = "0.2.2"
description = "Embeddings and loss functions for different data types."
authors = [{name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10,<4.0"
keywords = ["pytorch", "deep learning", "command-line interface"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch>=1.10.2",
    "plotly>=6.1.1",
    "scikit-learn>=1.0.2",
    "kaleido>=1.0.0,<2",
    "attrs>=19",
    "hierarchicalsoftmax>=1.4.1",
    "pandas>=2.3.3,<3.0.0",
]

[project.urls]
Repository = "https://github.com/rbturnbull/polytorch/"
Documentation = "https://rbturnbull.github.io/polytorch"
Homepage = "https://github.com/rbturnbull/polytorch/"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "ipykernel>=6.6.1",
    "coverage>=5.5",
    "autopep8>=1.5.7",
    "Sphinx>=4.2.0",
    "nbsphinx>=0.8.7",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autobuild>=2021.3.14",
    "myst-parser>=0.15.2",
    "pre-commit>=2.15.0",
    "sphinx-copybutton>=0.4.0",
    "black>=21.10b0",
    "sphinx-click",
    "mypy>=1.4.1",
]

[tool.uv.sources]
sphinx-click = { git = "https://github.com/rbturnbull/sphinx-click.git" }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polytorch"
module-root = ""
